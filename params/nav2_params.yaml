# Nav2 파라미터 - 자이카 Y모델 주차 미션 (ROS2 Humble)
#
# track_parking 대비 핵심 변경: 전역 플래너를 NavFn -> Smac Hybrid-A*로 교체.
#   NavFn은 2D 그리드 A*라 차량 방향(yaw)도 최소회전반경도 모르는 경로를 낸다.
#   Ackermann 차량으로는 추종 불가능한 경로가 나오고, 후진은 아예 표현이 안 된다.
#
# 참고 스킬(.claude/skills/) 대비 정정한 부분 2가지 - 실제 Humble 기준
#   1) 플러그인 이름: 스킬은 "nav2_smac_planner::SmacPlannerHybridAstar"라고 적었지만
#      Humble에 실제 등록된 이름은 "nav2_smac_planner/SmacPlannerHybrid"다.
#   2) allow_reverse_expansion: 스킬은 Hybrid 파라미터로 적었지만 실제로는
#      SmacPlannerLattice 전용이다. Hybrid에서 후진을 켜는 스위치는
#      motion_model_for_search: "REEDS_SHEPP" 하나뿐이고, 후진 선호도는
#      reverse_penalty로 조절한다. Hybrid에 allow_reverse_expansion을 넣으면
#      그냥 무시되므로 "켰다고 생각했는데 안 켜진" 상태가 되기 쉽다.
#
# 실측값 근거는 track_parking/MEASUREMENTS.md (실차 측정 완료)

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Ackermann 전용 모션모델이 nav2에 없어 차동구동 모델로 근사한다.
    # rot1 -> trans -> rot2 3단계 분해에 alpha1~4로 노이즈를 씌운다.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false

    # 주차 미션은 저속 + 짧은 거리 이동이 많다. 기본값(0.25/0.2)이면
    # 갱신이 너무 뜸해서 기동 직전 위치가 낡은 값일 수 있다.
    update_min_d: 0.10
    update_min_a: 0.15
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5

    # 대회 규정상 출발 위치가 고정이므로 공문값을 그대로 주입한다.
    # RViz에서 매번 2D Pose Estimate를 찍을 필요가 없다.
    set_initial_pose: true
    initial_pose:
      x: 1.8
      y: 0.9
      z: 0.0
      yaw: 3.14

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.20
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0

      # REEDS_SHEPP = 전진+후진 원호 모두 사용. 이게 후진을 켜는 유일한 스위치다.
      # DUBIN으로 두면 후진 경로가 아예 안 나온다.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72        # 5도 해상도

      # 실측 최소회전반경 0.471m (= wheelbase 0.33 / tan(35도)).
      # 여유를 두되, 통로가 좁아(중앙통로 0.90m) 너무 키우면 경로 생성이 실패한다.
      minimum_turning_radius: 0.50

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      lookup_table_size: 8.0             # 맵이 7.15x7.45m라 20은 과하다
      allow_unknown: false
      cache_obstacle_heuristic: false

      # 통로가 좁으므로 벽에 붙지 않도록 cost_penalty를 기본(2.0)보다 올린다.
      cost_penalty: 3.5
      reverse_penalty: 2.0               # 후진 가능하되 전진을 선호
      change_penalty: 0.15               # 전/후진 전환 남발 억제
      non_straight_penalty: 1.20
      retrospective_penalty: 0.015

      downsample_costmap: false
      downsampling_factor: 1
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 좁은 통로를 저속으로 통과하는 구간이 있어 0.3m/15s는 빡빡하다.
      # 실제로 통로에서 감속하다 progress 실패로 중단되는 일이 있었다.
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20

      # ⚠️ yaw는 사실상 검사하지 않는다(3.15 rad = 180도). 반드시 이래야 한다.
      #
      # 0.15 rad(8.6도)로 뒀더니 첫 경유점에서 미션이 멈췄다:
      #     경유점 1/7 목표 yaw 98.1도 / 차량 실제 114.6도 -> 16.5도 부족
      #     위치는 1.6cm로 도착했는데 방위가 모자라 목표 미달
      #     controller_server [ERROR]: Failed to make progress
      #     behavior_server: Running spin ... (무한 반복)
      #
      # Ackermann 차량은 제자리 회전을 못 한다. 목표 위치에 이미 도착한 뒤
      # 방위만 16도 고치는 것은 물리적으로 불가능하다(앞뒤로 호를 그려야 하는데
      # RPP는 목표 지점에서 그런 기동을 하지 않는다). 그래서 영원히 만족하지
      # 못하고 복구 동작만 반복한다.
      #
      # 방위를 포기해도 되는 이유:
      #   - 경유점은 통과점일 뿐이다. 방위를 맞출 이유가 없다.
      #   - 최종 진입 지점은 그 앞 0.45m에 '예비 경유점'을 같은 방위로 두었으므로
      #     차가 자연스럽게 그 방향으로 들어온다.
      #   - 주차 기동은 도착한 실제 pose에서 매번 새로 푼다. 진입 방위가 십수 도
      #     틀어져 있어도 해가 그대로 나온다(geometry.py self-test로 검증).
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.5
      use_regulated_linear_velocity_scaling: true

      # ⚠️ 비용 기반 감속을 끈다.
      # 우리 통로는 폭이 0.70m / 0.50m라 팽창 후에는 전 구간이 고비용이다.
      # 켜두면 통로 내내 최저속으로 기어가다 progress checker에 걸린다.
      # 곡률 기반 감속(use_regulated_linear_velocity_scaling)은 유지하므로
      # 코너에서는 여전히 줄인다.
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false

      # 전방 충돌 예측 시간. 기본 1.0초는 0.35m/s에서 35cm를 미리 보는데,
      # 좁은 통로의 완만한 곡선에서도 팽창 셀을 스쳐 오검출이 난다.
      #
      # 0.4로도 아래가 남아 있다:
      #     RegulatedPurePursuitController detected collision ahead!
      #     [follow_path] Aborting handle
      # 미션은 완주하므로 치명적이진 않고, 복구 동작을 한 번 돌면서 느려지는
      # 수준이다. 0.3이면 10cm 앞만 보므로 오검출이 더 준다. 그래도 실제
      # 장애물은 초음파(후방)와 costmap(전방)이 잡는다.
      max_allowed_time_to_collision_up_to_carrot: 0.3

      # Ackermann 차량은 제자리 회전이 물리적으로 불가능하다.
      # 또한 use_rotate_to_heading과 allow_reversing은 동시에 true일 수 없다
      # (Nav2가 설정 검증에서 거부한다).
      use_rotate_to_heading: false
      allow_reversing: true

      max_angular_accel: 1.5
      max_robot_pose_search_dist: 5.0
      use_interpolation: true
      min_turning_radius: 0.50

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0

    # ⚠️ spin을 빼면 bt_navigator가 아예 뜨지 않는다.
    #
    # Ackermann은 제자리 회전이 불가하니 spin을 빼는 게 맞다고 생각해 제외했더니
    # bt_navigator가 이렇게 죽었다:
    #     "spin" action server not available after waiting for 1.00s
    #     Error loading XML file: navigate_through_poses_w_replanning_and_recovery.xml
    #     Failed to bring up all requested nodes. Aborting bringup.
    #
    # Nav2 기본 Behavior Tree XML이 Spin 액션을 참조하기 때문에, 서버가 없으면
    # BT 로드 자체가 실패한다. 그래서 '서버는 띄우되 실제로는 무해하게' 둔다.
    #
    # 실제로 spin이 호출돼도 이 차는 움직이지 않는다. cmd_vel_bridge가
    # |linear.x| < 1e-3이면 조향과 속도를 모두 0으로 내보내기 때문이다.
    # 즉 복구 동작이 제자리 회전을 시도하면 그냥 시간만 쓰고 넘어간다.
    # 차가 엉뚱하게 도는 일은 없다.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /vesc_odom
    transform_tolerance: 0.5

    # 기본 10ms(100Hz)로는 이 보드에서 BT 루프가 못 따라간다.
    #     [bt_navigator] [WARN]: Behavior Tree tick rate 100.00 was exceeded
    # 20ms(50Hz)면 충분하다. BT는 액션 상태를 확인하는 일이 전부라
    # 제어 주기(20Hz)보다 빠르기만 하면 된다.
    bt_loop_duration: 20
    default_server_timeout: 20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # 실측 footprint. base_link = 뒷차축 중심.
      # 앞 +0.46 / 뒤 -0.15 / 좌우 ±0.15
      footprint: "[[0.46, 0.15], [0.46, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 감쇠를 가파르게 해서 벽 바로 옆만 비싸고 조금만 떨어져도 싸지게 한다.
        cost_scaling_factor: 10.0

        # ⚠️ 이 값이 곧 '253(inscribed) 띠'의 두께이고, RPP는 footprint 아래
        # 253 셀이 하나라도 있으면 충돌로 판정한다.
        #
        # 0.22로 뒀더니 북측/서측 통로를 영원히 못 지나갔다:
        #     RegulatedPurePursuitController detected collision ahead!
        #     -> follow_path Aborting -> costmap clear -> spin -> 반복
        #
        # 산술이 이렇다. 중심선에서 d만큼 벗어났을 때
        #     차체 가장자리~벽 = (통로반폭 - 차량반폭 0.15 - d)
        # 이 값이 inflation_radius보다 작으면 충돌이다.
        #
        #   통로   자유폭  반폭   0.22일 때 허용 d   0.08일 때
        #   북측   0.70   0.35   -0.02 (항상 충돌)   +0.12
        #   서측   0.50   0.25   -0.12 (항상 충돌)   +0.02
        #   동측   1.00   0.50   +0.13              +0.27
        #
        # 즉 0.22는 "완벽히 가운데로 가도 통과 불가"였다.
        #
        # 0.08이면 북측은 12cm까지 벗어나도 되고(AMCL 오차 ~5cm), 서측은
        # 2cm뿐이라 여전히 아슬아슬하다. 서측 자유폭이 0.50m, 차폭이 0.30m라
        # 좌우 10cm씩이 물리적 전부이므로 이건 설정으로 더 못 늘린다.
        inflation_radius: 0.08
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.46, 0.15], [0.46, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.08   # local_costmap과 같은 이유 (위 주석 참고)
      always_send_full_costmap: true
