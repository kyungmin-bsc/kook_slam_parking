# Nav2 파라미터 - 자이카 Y모델 주차 미션 (ROS2 Humble)
#
# track_parking 대비 핵심 변경: 전역 플래너를 NavFn -> Smac Hybrid-A*로 교체.
#   NavFn은 2D 그리드 A*라 차량 방향(yaw)도 최소회전반경도 모르는 경로를 낸다.
#   Ackermann 차량으로는 추종 불가능한 경로가 나오고, 후진은 아예 표현이 안 된다.
#
# 참고 스킬(.claude/skills/) 대비 정정한 부분 2가지 - 실제 Humble 기준
#   1) 플러그인 이름: 스킬은 "nav2_smac_planner::SmacPlannerHybridAstar"라고 적었지만
#      Humble에 실제 등록된 이름은 "nav2_smac_planner/SmacPlannerHybrid"다.
#   2) allow_reverse_expansion: 스킬은 Hybrid 파라미터로 적었지만 실제로는
#      SmacPlannerLattice 전용이다. Hybrid에서 후진을 켜는 스위치는
#      motion_model_for_search: "REEDS_SHEPP" 하나뿐이고, 후진 선호도는
#      reverse_penalty로 조절한다. Hybrid에 allow_reverse_expansion을 넣으면
#      그냥 무시되므로 "켰다고 생각했는데 안 켜진" 상태가 되기 쉽다.
#
# 실측값 근거는 track_parking/MEASUREMENTS.md (실차 측정 완료)

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Ackermann 전용 모션모델이 nav2에 없어 차동구동 모델로 근사한다.
    # rot1 -> trans -> rot2 3단계 분해에 alpha1~4로 노이즈를 씌운다.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false

    # 주차 미션은 저속 + 짧은 거리 이동이 많다. 기본값(0.25/0.2)이면
    # 갱신이 너무 뜸해서 기동 직전 위치가 낡은 값일 수 있다.
    update_min_d: 0.10
    update_min_a: 0.15
    transform_tolerance: 1.0
    tf_broadcast: true
    save_pose_rate: 0.5

    # 대회 규정상 출발 위치가 고정이므로 공문값을 그대로 주입한다.
    # RViz에서 매번 2D Pose Estimate를 찍을 필요가 없다.
    set_initial_pose: true
    initial_pose:
      x: 1.8
      y: 0.9
      z: 0.0
      yaw: 3.14

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.20
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0

      # REEDS_SHEPP = 전진+후진 원호 모두 사용. 이게 후진을 켜는 유일한 스위치다.
      # DUBIN으로 두면 후진 경로가 아예 안 나온다.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72        # 5도 해상도

      # 실측 최소회전반경 0.471m (= wheelbase 0.33 / tan(35도)).
      # 여유를 두되, 통로가 좁아(중앙통로 0.90m) 너무 키우면 경로 생성이 실패한다.
      minimum_turning_radius: 0.50

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      lookup_table_size: 8.0             # 맵이 7.15x7.45m라 20은 과하다
      allow_unknown: false
      cache_obstacle_heuristic: false

      # 통로가 좁으므로 벽에 붙지 않도록 cost_penalty를 기본(2.0)보다 올린다.
      cost_penalty: 3.5
      reverse_penalty: 2.0               # 후진 가능하되 전진을 선호
      change_penalty: 0.15               # 전/후진 전환 남발 억제
      non_straight_penalty: 1.20
      retrospective_penalty: 0.015

      downsample_costmap: false
      downsampling_factor: 1
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 진입 pose 정확도가 곧 주차 정확도... 는 아니다. 주차 기동은 도착한
      # 실제 위치에서 다시 풀기 때문에 여기가 조금 벗어나도 흡수된다.
      # 그래서 무리하게 조이지 않는다 (조이면 Nav2가 목표 근처에서 헤맨다).
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false

      # Ackermann 차량은 제자리 회전이 물리적으로 불가능하다.
      # 또한 use_rotate_to_heading과 allow_reversing은 동시에 true일 수 없다
      # (Nav2가 설정 검증에서 거부한다).
      use_rotate_to_heading: false
      allow_reversing: true

      max_angular_accel: 1.5
      max_robot_pose_search_dist: 5.0
      use_interpolation: true
      min_turning_radius: 0.50

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Spin(제자리 회전)은 Ackermann 차량이 수행 불가하므로 제외한다.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /vesc_odom
    transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # 실측 footprint. base_link = 뒷차축 중심.
      # 앞 +0.46 / 뒤 -0.15 / 좌우 ±0.15
      footprint: "[[0.46, 0.15], [0.46, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 중앙통로 폭이 0.90m, 차폭 0.30m -> 좌우 여유 0.30m씩.
        # inflation_radius를 0.3 이상 주면 통로가 통째로 막혀 경로가 안 나온다.
        inflation_radius: 0.22
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.46, 0.15], [0.46, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.22
      always_send_full_costmap: true
